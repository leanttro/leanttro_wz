const wf=document.getElementById('workFrame'),lf=document.getElementById('lifeFrame'),df=document.getElementById('dayFrame');wf.srcdoc=workDoc;lf.srcdoc=lifeDoc;df.srcdoc=dayDoc;
const FR={day:[df,'dayBtn','Meu dia'],work:[wf,'workBtn','Trabalho'],life:[lf,'lifeBtn','Vida Pessoal']};
function switchTo(w){for(const k in FR){const on=k===w;FR[k][0].classList.toggle('active',on);document.getElementById(FR[k][1]).classList.toggle('active',on)}document.title='WHAZIDEIA — '+FR[w][2]}
for(const k in FR)document.getElementById(FR[k][1]).addEventListener('click',()=>switchTo(k));

function showCaptureToast(message,error=false){const t=document.getElementById('capToast');t.textContent=message;t.style.background=error?'#8b2f2f':'#263b36';t.classList.add('show');clearTimeout(window.__capToastTimer);window.__capToastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function capture(dest){const i=document.getElementById('capIn'),text=i.value.trim();if(!text){i.focus();return false}const key=dest==='work'?'mindOSData':'mindOS_vida_v3';let d={};try{const raw=__mosLS.getItem(key);d=raw?JSON.parse(raw):{};if(!d||typeof d!=='object'||Array.isArray(d))d={};d.inbox=Array.isArray(d.inbox)?d.inbox:[];const id=(window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36),n=new Date(),day=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');d.inbox.unshift(dest==='work'?{id,text,type:'thought',area:'Leanttro',created:day}:{id,text,created:day});const serialized=JSON.stringify(d);__mosLS.setItem(key,serialized);const check=JSON.parse(__mosLS.getItem(key)||'{}');if(!Array.isArray(check.inbox)||!check.inbox.some(x=>x.id===id))throw new Error('Não foi possível confirmar o salvamento');}catch(e){showCaptureToast('Não consegui salvar. Seu texto continua aqui; copie ou tente novamente.',true);return false}i.value='';try{sessionStorage.removeItem('whazideia_capture_draft')}catch(e){}showCaptureToast(dest==='work'?'Salvo na Caixa mental de Trabalho ✓':'Salvo nas anotações da Vida ✓');return true}
document.querySelectorAll('#capForm [data-dest]').forEach(b=>b.addEventListener('click',()=>capture(b.dataset.dest)));
const capInput=document.getElementById('capIn');try{const draft=sessionStorage.getItem('whazideia_capture_draft');if(draft&&!capInput.value)capInput.value=draft}catch(e){}capInput.addEventListener('input',()=>{try{sessionStorage.setItem('whazideia_capture_draft',capInput.value)}catch(e){}});
document.getElementById('capForm').addEventListener('submit',e=>{e.preventDefault();const dest=lf.classList.contains('active')?'life':'work';capture(dest)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();capInput.focus();capInput.select()}});

(()=>{const KEY='mindOS_modules_v2';
const G=[['MEU ESPAÇO',[['day','Meu dia','Sua visão rápida das prioridades e compromissos.'],['cal','Calendário','Visão do mês e tarefas com data.']]],
['TRABALHO',[['dashboard','Painel de trabalho','Resumo, prioridades e visão geral.'],['inbox','Caixa mental','Capture pensamentos e organize depois.'],['tasks','Tarefas','Pendências, prazos e prioridades.'],['projects','Projetos','Acompanhe o que está em andamento.'],['ideas','Ideias & estacionamento','Guarde oportunidades e coisas para depois.'],['focus','Modo foco','Timer e sessões de concentração.'],['reports','Relatórios','Acompanhe seu progresso.']]],
['VIDA PESSOAL',[['home','Visão geral da vida','Resumo de metas, dinheiro e anotações.'],['goals','Metas & objetivos','Transforme desejos em ações com prazo.'],['money','Meu dinheiro','Separe antes de gastar.'],['future','Daqui a 5 anos','Imagine cenários para a sua vida.'],['vent','Desconte aqui','Desabafe sem julgamento.']]]];
const ALL=G.flatMap(g=>g[1].map(m=>m[0])),ESS=['day','dashboard','inbox','tasks','projects','ideas'],WORK=G[1][1].map(m=>m[0]),LIFE=G[2][1].map(m=>m[0]);
const PRE=[['ess','Essencial','Uma experiência mais leve para o dia a dia'],['all','Completo','Todos os recursos disponíveis'],['custom','Personalizado','Você escolhe módulo por módulo']];
const $=i=>document.getElementById(i),same=(a,b)=>a.size===b.length&&b.every(x=>a.has(x));let sel=new Set(),forced=false;
function load(){try{const c=JSON.parse(__mosLS.getItem(KEY));if(c&&Array.isArray(c.mods))return c.mods.filter(x=>ALL.includes(x))}catch(e){}return null}
function save(){try{__mosLS.setItem(KEY,JSON.stringify({mods:[...sel]}))}catch(e){}}
const mode=()=>forced?'custom':same(sel,ESS)?'ess':same(sel,ALL)?'all':'custom';
function draw(){const md=mode();
 $('pres').innerHTML=PRE.map(p=>'<button type="button" class="pc'+(md===p[0]?' on':'')+'" data-p="'+p[0]+'"><b>'+p[1]+'</b><small>'+p[2]+'</small></button>').join('');
 $('modList').innerHTML=G.map(g=>'<div class="sec"><div class="sl">'+g[0]+'</div>'+g[1].map(m=>'<div class="row" data-m="'+m[0]+'"><div><b>'+m[1]+'</b><small>'+m[2]+'</small></div><button type="button" class="sw" role="switch" aria-label="'+m[1]+'" aria-checked="'+sel.has(m[0])+'"></button></div>').join('')+'</div>').join('');
 $('modCount').textContent=sel.size?sel.size+' de '+ALL.length+' módulos ativos':'Escolha pelo menos um módulo'}
function fixLanding(f){try{const d=f.contentDocument,w=d.defaultView,a=d.querySelector('.nav button.active[data-page]');if(a&&w.getComputedStyle(a).display==='none'){const n=[...d.querySelectorAll('.nav button[data-page]')].find(b=>w.getComputedStyle(b).display!=='none');if(n)n.click()}}catch(e){}}
function css(w,l){const h=ALL.filter(m=>!sel.has(m)).map(m=>'[data-page="'+m+'"],[data-go="'+m+'"],[data-mod="'+m+'"]');let c=h.length?h.join(',')+'{display:none!important}':'';if(!w)c+='[data-grp="trab"]{display:none!important}';if(!l)c+='[data-grp="vida"]{display:none!important}';return c}
function applyFrame(f,w,l){try{const d=f.contentDocument;if(!d||!d.head)return;let st=d.getElementById('modcss');if(!st){st=d.createElement('style');st.id='modcss';d.head.appendChild(st)}st.textContent=css(w,l);fixLanding(f)}catch(e){}}
const has=a=>a.some(m=>sel.has(m));
function apply(){const w=has(WORK),l=has(LIFE),dy=sel.has('day')||sel.has('cal'),inb=sel.has('inbox');
 $('dayBtn').style.display=dy?'':'none';$('workBtn').style.display=w?'':'none';$('lifeBtn').style.display=l?'':'none';
 const cw=document.querySelector('#capForm [data-dest=work]'),cl=document.querySelector('#capForm [data-dest=life]');cw.style.display=inb?'':'none';cl.style.display=l?'':'none';$('capForm').style.display=(inb||l)?'':'none';
 [df,wf,lf].forEach(f=>applyFrame(f,w,l));
 const vis={day:dy,work:w,life:l},cur=Object.keys(FR).find(k=>FR[k][0].classList.contains('active'));if(!vis[cur]){const n=Object.keys(vis).find(k=>vis[k]);if(n)switchTo(n)}}
function openS(){draw();$('setup').classList.add('show')}
function closeS(){if(!sel.size){draw();return}save();$('setup').classList.remove('show');apply()}
$('modList').addEventListener('click',e=>{const r=e.target.closest('[data-m]');if(!r)return;const m=r.dataset.m;sel.has(m)?sel.delete(m):sel.add(m);forced=false;if(mode()==='custom')forced=true;draw()});
$('pres').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=b.dataset.p;forced=p==='custom';if(p==='ess')sel=new Set(ESS);if(p==='all')sel=new Set(ALL);draw()});
$('setupGo').addEventListener('click',closeS);$('setupX').addEventListener('click',closeS);
